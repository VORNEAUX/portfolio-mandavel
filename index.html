const FEDGE=[];for(let v=7200;v<=16000;v+=800)FEDGE.push(v);

 const lo=Math.floor(cam),f=cam-lo,cx=xs(lo)+(xs(Math.min(lo+1,N-1))-xs(lo))*f,sh=cam*SP,ZL=D*.875;

 const L=(a,b)=>{let[ax,ay,az]=a,[bx,by,bz]=b;if(az>ZL&&bz>ZL)return null;
  if(az>ZL){const t=(ZL-az)/(bz-az);ax+=(bx-ax)*t;ay+=(by-ay)*t;az=ZL}else if(bz>ZL){const t=(ZL-bz)/(az-bz);bx+=(ax-bx)*t;by+=(ay-by)*t;bz=ZL}
  const sa_=D/(D-az),sb_=D/(D-bz);return[ox+(w/2+ax-ox)*sa_,oy+(h/2+ay-oy)*sa_,ox+(w/2+bx-ox)*sb_,oy+(h/2+by-oy)*sb_,sa_,sb_]};
 const M=v=>v<7200?1:Math.max(0,(16000-v)/8800);
 fg.setTransform(FD,0,0,FD,0,0);fg.clearRect(0,0,w,h);fg.lineCap="butt";
 // fasce lungo la profondità: ai bordi dove cambia la prospettiva e dove sfuma la maschera
 const E=new Set([0,16000,...FEDGE]);for(const s of[8,4,2.5,1.6,1.1,.8,.6,.45,.33,.24,.17,.12,.08]){const z=D*(1-1/s),v=3000+sh-z;if(v>0&&v<16000)E.add(Math.round(v))}
 const ed=[...E].sort((p,q)=>p-q);
 const K=Math.ceil((w*3+400)/125/2)+4;
 for(let i=0;i<ed.length-1;i++){const v0=ed[i],v1=ed[i+1],al=M((v0+v1)/2);if(al<.01)continue;

 // linee trasversali (una ogni 125, spessore reale proiettato)
 for(let m=0;m<=128;m++){const v=m*125,al=M(v);if(al<.01)continue;const l=L(P(-2500,v),P(2500,v));if(!l)continue;
