#frame{flex:1;min-height:0;border:0;width:100%;background:#fff}
@media(max-width:820px){.card{grid-template-columns:1fr;gap:18px}.info{transform:translateZ(40px)}.info p{font-size:14px}.tech{display:none}.info h2{font-size:32px;margin:6px 0 8px}.big{top:-26%}#rail button span,.cd{display:none}#rail{left:10px}.mk{left:14px}.tr{right:14px}.mk img{height:42px}.act{margin-top:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1}}

::view-transition{background:#04060a}
::view-transition-group(root){animation-duration:1.2s}
::view-transition-old(root),::view-transition-new(root){mix-blend-mode:normal;transform-origin:50% 50%;animation-duration:1.2s;animation-timing-function:cubic-bezier(.7,0,.15,1);animation-fill-mode:both}
::view-transition-old(root){animation-name:tvo}::view-transition-new(root){animation-name:tvn}

@keyframes tvn{from{transform:perspective(1800px) translateZ(-520px) rotateY(62deg);filter:blur(8px) brightness(1.5);opacity:0}}
@media(max-width:820px){#rail{left:50%;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row;gap:0}#rail button{font-size:0;gap:0;padding:12px 3px}#rail button:before{width:12px;height:3px;border-radius:2px}#rail button.on:before{width:24px}#hud{bottom:calc(26px + env(safe-area-inset-bottom))}#hud b{font-size:22px}#cat,#hint{display:none}.note{font-size:12px;padding:10px 12px;margin-top:12px}.hero p{font-size:14px}}

const cats=["Tutti",...new Set(P.map(p=>p.cat))];
$("#chips").innerHTML=cats.map((c,i)=>`<button class="chip" data-c="${c}" aria-pressed="${!i}" type="button">${c}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;$$(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));$$(".row").forEach(r=>r.classList.toggle("dim",b.dataset.c!=="Tutti"&&r.dataset.cat!==b.dataset.c))};
// Stato
let busy=0,dirty=1,lastT=0,lastC=0,target=0,cam=RM?0:-.9,mx=0,my=0,rx=0,ry=0,active=-1,tm,prev=cam;
const sc=()=>$$(".screen").forEach(s=>s.firstElementChild.style.transform=`scale(${s.clientWidth/1280})`);sc();addEventListener("resize",sc);
const xs=i=>i?(i%2?1:-1)*Math.min(innerWidth*.07,90):0;
const go=i=>{target=clamp(Math.round(i),0,N-1);$("#hint").style.opacity=0};
function setActive(a){active=a;document.body.classList.toggle("h0",!a);$$("#rail button").forEach((b,i)=>b.classList.toggle("on",i===a));
 $("#cnt").textContent=a?pad(a)+" / "+pad(P.length):"Inizio";$("#cat").textContent=a?P[a-1].cat:"Scorri per entrare";
 clearTimeout(tm);tm=setTimeout(()=>pns.forEach((p,i)=>{const f=p.querySelector("iframe");if(!f)return;
  if(i===active&&!f.dataset.l){f.dataset.l=1;f.src="progetti/"+P[i-1].file;f.onload=()=>f.classList.add("ok")}
  else if(i!==active&&f.dataset.l){delete f.dataset.l;f.classList.remove("ok");f.removeAttribute("src");f.src="about:blank"}}),500)}
// Particelle di profondità (tratti raggruppati per fascia: poche chiamate di disegno)
const cv=$("#fx"),g=cv.getContext("2d");let W,H,pc="190,205,255";const pts=[...Array(120)].map(()=>({x:Math.random()*2-1,y:Math.random()*2-1,w:Math.random()*.95+.05}));
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;dirty=1;sc()};rs();addEventListener("resize",rs);
function draw(v,dt){g.clearRect(0,0,W,H);g.lineCap="round";const B=[[],[],[],[],[],[]];
 for(const p of pts){p.w-=v*.35+.0005*dt;if(p.w<.03){p.w=1;p.x=Math.random()*2-1;p.y=Math.random()*2-1}if(p.w>1)p.w=.03;
  const k=W*.045/p.w,k2=W*.045/(p.w+v*.35);B[Math.min(5,p.w*6|0)].push(W/2+p.x*k2,H*.45+p.y*k2,W/2+p.x*k,H*.45+p.y*k)}
 B.forEach((b,i)=>{if(!b.length)return;const w=(i+.5)/6;g.strokeStyle=`rgba(${pc},${(1-w)*.75})`;g.lineWidth=Math.max(.6,2.2*(1-w));g.beginPath();for(let j=0;j<b.length;j+=4){g.moveTo(b[j],b[j+1]);g.lineTo(b[j+2],b[j+3])}g.stroke()})}
// Tema chiaro/scuro con transizione 3D (View Transitions API; senza supporto il cambio è immediato)
const root=document.documentElement;
function setTheme(t,save){root.dataset.theme=t;pc=t==="light"?"40,70,160":"190,205,255";$("#thl").textContent=t==="light"?"Tema scuro":"Tema chiaro";if(save)try{localStorage.setItem("mv-theme",t)}catch(e){}}
setTheme(root.dataset.theme==="light"?"light":"dark");
$("#bth").onclick=()=>{const t=root.dataset.theme==="light"?"dark":"light";if(RM||!document.startViewTransition){setTheme(t,1);return}document.startViewTransition(()=>setTheme(t,1))};
// Ciclo di animazione: aggiorna solo ciò che cambia, in pausa quando un pannello è aperto
function frame(t){requestAnimationFrame(frame);if(busy){lastT=t;return}
 const dt=Math.min(3,(t-lastT)/16.7||1);lastT=t;const mv=cam!==target;
 if(mv){cam+=(target-cam)*(RM?1:1-Math.pow(.93,dt));if(Math.abs(target-cam)<.0004)cam=target}
 if(Math.abs(my*-5-rx)>.004||Math.abs(mx*7-ry)>.004){const k=1-Math.pow(.94,dt);rx+=(my*-5-rx)*k;ry+=(mx*7-ry)*k;tilt.style.transform=`rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg)`}
 if(mv||dirty){dirty=0;const lo=Math.floor(cam),f=cam-lo,cx=xs(lo)+(xs(Math.min(lo+1,N-1))-xs(lo))*f;
  world.style.transform=`translate3d(${-cx}px,0,${cam*SP}px)`;
  pns.forEach((p,i)=>{const d=i-cam,o=d>=0?(1-Math.min(d,1))**2:clamp(1+d*2.4,0,1);
   if(o<.01){if(p._v!==0){p.style.visibility="hidden";p._v=0}if(p._on!==false){p._on=false;p.inert=true}return}
   if(p._v!==1){p.style.visibility="visible";p._v=1}p.style.opacity=o;
   p.style.transform=`translate(-50%,-50%) translate3d(${xs(i)}px,0,${-i*SP}px) rotateY(${(i%2?-1:1)*Math.max(0,d)*14}deg)`;
   const on=Math.abs(d)<.35;if(p._on!==on){p._on=on;p.inert=!on}});
  const a=Math.round(cam);if(a!==active)setActive(a)}
 const v=cam-prev;prev=cam;if(!RM&&(mv||t-lastC>45)){lastC=t;draw(v,dt)}}
requestAnimationFrame(frame);
// Input
const open=()=>$(".ov.on,#viewer.on");let snap,dy=0,drag=0,moved=0;
addEventListener("wheel",e=>{if(open())return;target=clamp(target+e.deltaY*.0011,0,N-1);$("#hint").style.opacity=0;clearTimeout(snap);snap=setTimeout(()=>target=Math.round(target),170)},{passive:true});
addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;if(drag){const d=e.clientY-dy;dy=e.clientY;if(Math.abs(d)>0)moved+=Math.abs(d);target=clamp(target-d/innerHeight*1.3,0,N-1)}});
$("#cam").addEventListener("pointerdown",e=>{if(open())return;drag=1;dy=e.clientY;moved=0});
addEventListener("pointerup",()=>{if(!drag)return;drag=0;target=Math.round(target);if(moved<8)moved=0;else setTimeout(()=>moved=0,60)});
const ovs=n=>{["idx","info"].forEach(k=>{const e=$("#"+k);e.classList.toggle("on",k===n);e.inert=k!==n});busy=!!open()};
function info(id){const p=P.find(x=>x.id===id);$("#info .in").innerHTML=`<span class="mono">${p.cat} · ${p.type}</span><h2>${p.title}</h2><dl><dt>Obiettivo</dt><dd>${p.need}</dd><dt>Soluzione</dt><dd>${p.sol}</dd><dt>Funzioni principali</dt><dd><ul>${p.feat.map(f=>`<li>${f}</li>`).join("")}</ul></dd><dt>Limiti dichiarati</dt><dd class="lim">${p.note}</dd></dl>`;ovs("info")}
document.addEventListener("click",e=>{if(moved){e.preventDefault();e.stopPropagation();return}
 const t=e.target.closest("[data-open],[data-go],[data-info],[data-close]");if(!t)return;
 if(t.dataset.open)location.hash="prova-"+t.dataset.open;else if(t.dataset.go!==undefined){go(+t.dataset.go);ovs(0)}else if(t.dataset.info)info(t.dataset.info);else ovs(0)},true);
$("#bidx").onclick=()=>ovs("idx");$("#b2").onclick=()=>ovs("idx");
addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#viewer.on"))$("#vclose").click();else ovs(0);return}if(open())return;
 const k=e.key;if(["ArrowDown","ArrowRight","PageDown"," "].includes(k)){e.preventDefault();go(Math.round(target)+1)}else if(["ArrowUp","ArrowLeft","PageUp"].includes(k)){e.preventDefault();go(Math.round(target)-1)}else if(k==="Home")go(0);else if(k==="End")go(N-1);else if(k==="i"||k==="I")ovs("idx")});
// Visualizzatore
let vt;
function show(){const m=location.hash.match(/^#prova-(\d+)$/),p=m&&P.find(x=>x.id===m[1]),v=$("#viewer");
 if(!p){if(v.classList.contains("on")){v.classList.remove("on");v.classList.add("cl");clearTimeout(vt);vt=setTimeout(()=>{v.classList.remove("cl");if(!v.classList.contains("on")){$("#frame").src="about:blank";setActive(active)}},820)}busy=!!open();return}
 $("#vt").textContent=p.id+" · "+p.title;$("#frame").title="Concept: "+p.title;$("#frame").src="progetti/"+p.file;$("#vopen").href=$("#vdl").href="progetti/"+p.file;ovs(0);clearTimeout(vt);v.classList.remove("cl");pns.forEach(q=>{const f=q.querySelector("iframe");if(f&&f.dataset.l){delete f.dataset.l;f.classList.remove("ok");f.src="about:blank"}});v.classList.add("on");busy=1;$("#vclose").focus()}
addEventListener("hashchange",show);show();
$("#vclose").onclick=()=>{history.replaceState(null,"",location.pathname+location.search);show()};
</script>
</body>
