`<div class="art"><div class="lgd"><div class="h"><span>N°</span><span>Richiesta</span><span>Stato</span></div>${rw("001","Preventivo","Accettato","a")}${rw("002","Preventivo","Inviato","i")}${rw("003","Preventivo","In attesa","")}${rw("004","Preventivo","Da inviare","d")}${rw("005","Preventivo","Accettato","a")}</div></div>`,
`<div class="art"><svg viewBox="0 0 400 300" role="img" aria-label="Struttura di un sito di 5 pagine con Profilo Google e presentazione"><g class="ln"><path d="M200 66V108M200 108H60V150M200 108H140V150M200 108H260V150M200 108H340V150M60 188V240M340 188V240"/></g><g class="hm"><rect x="150" y="26" width="100" height="40"/><text x="200" y="51">Home</text></g><g><rect x="22" y="150" width="76" height="38"/><text x="60" y="173">Studio</text><rect x="102" y="150" width="76" height="38"/><text x="140" y="173">Servizi</text><rect x="222" y="150" width="76" height="38"/><text x="260" y="173">Progetti</text><rect x="302" y="150" width="76" height="38"/><text x="340" y="173">Contatti</text><rect x="10" y="240" width="100" height="40" stroke-dasharray="4 3"/><text x="60" y="264">Profilo Google</text><rect x="290" y="240" width="100" height="40" stroke-dasharray="4 3"/><text x="340" y="264">Presentazione</text></g></svg></div>`,
`<div class="art"><div class="orb"><i class="o1"></i><i class="o2"></i><i class="o3"></i><img src="assets/favicon.png" alt=""><div class="ring6">${K[5].sv.map((s,i)=>`<div class="nd" style="--a:${i*72-90}deg"><span style="--a:${i*72-90}deg">${s}</span></div>`).join("")}</div></div></div>`,
`<div class="art"><div class="ec-w"><div class="ec-bar"><i></i><i></i><i></i><span></span></div><div class="ec-gd">${[1,2,3,4].map(n=>`<div class="ec-pc p${n}"><b></b><u></u><em></em></div>`).join("")}</div></div><div class="ec-ct"><span>Carrello</span><div class="ec-ln"><i></i><u></u><em></em></div><div class="ec-ln"><i></i><u></u><em></em></div><div class="ec-tt"><u></u><em></em></div><b>Paga</b></div><div class="ec-sg"><span>Aperto</span></div></div>`];

const RT=document.documentElement,N=K.length,SA=360/N,C=["#b3402a","#f2a93b","#7be0a8","#ff5a14","#c9a54b","#4a90ff","#ff6fb0"],RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
let pos=RM?0:-1.15,tg=0,zo=RM?0:520,act=-1,busy=0,dirty=1,mx=0,my=0,rx=0,ry=0,zc=0,snap,drag=null,dd=null,blk=0;
const ring=$("#ring"),tl=$("#tl"),dial=$("#dr"),walls=[];
const pl=(k,i)=>`<div class="pl"><span class="mono">${pad(i+1)} / ${pad(N)}${k.nuovo?` · <b class="nw">Nuovo</b>`:""}</span><h2>${k.n}</h2><p class="dsc">${k.d}</p><div class="pr"><s>${eur(k.val)}</s><b>${eur(k.pr)}</b><i><span class="dsh">−</span>${k.sc}%</i><u>Risparmi ${eur(k.ris)}</u></div><ul class="sv">${k.sv.map(s=>`<li>${s}</li>`).join("")}</ul><div class="ac"><button class="bt p" data-a="rq" data-i="${i}" type="button">Richiedi informazioni</button><button class="bt" data-a="ds" data-i="${i}" type="button">Come conviene</button></div><p class="tm">Consegna indicativa · 3${DSH}5 giorni</p></div>`;
K.forEach((k,i)=>{const w=document.createElement("section");w.className="wl w"+(i+1);w.style.setProperty("--i",i);w.setAttribute("aria-label",k.n);w.innerHTML='<div class="in">'+ART[i]+pl(k,i)+"</div>";ring.appendChild(w);walls.push(w)});
dial.innerHTML=K.map((k,i)=>`<button style="--k:${i}" data-g="${i}" aria-label="${k.n}" type="button">${pad(i+1)}</button>`).join("");
function size(){const w=innerWidth,h=innerHeight,m=w<860,ls=m&&w>h&&h<500,W=m?w*.9:Math.min(w*.84,1000),H=ls?Math.max(h-150,150):m?Math.min(h-215,560):Math.min(h*.66,580),R=W/2/Math.tan(Math.PI/N),R6=W/2/Math.tan(Math.PI/6);zc=R-R6*(1-(m?.62:.72));[["--W",W],["--H",H],["--R",R]].forEach(([a,b])=>RT.style.setProperty(a,b+"px"));RT.style.setProperty("--n",N);RT.classList.toggle("ls",ls);fit(m,ls,H);dirty=1}
// Adatta il contenuto al muro: sceglie un fattore di scala (mai sotto .72) così testi, prezzi e pulsanti stanno sempre dentro, senza sovrapposizioni
function fit(m,ls,H){RT.style.setProperty("--k",1);RT.style.setProperty("--ks",1);walls.forEach(w=>w.style.removeProperty("--ks"));
 if(!m){// desktop basso: solo le sale il cui testo supera il muro vengono ridotte, ciascuna in proporzione
  walls.forEach(w=>{const pl=w.querySelector(".pl"),t=pl.offsetTop,h=pl.offsetHeight;if(!h)return;const w3=w.classList.contains("w3"),w5=w.classList.contains("w5"),ks=w3?(t+h-H*.04)/h:w5?(H*.56-t)/h:(H*.965-t)/h;if(ks<1)w.style.setProperty("--ks",Math.max(.6,ks).toFixed(3))});return}
 let need=0;
 walls.forEach(w=>{const pl=w.querySelector(".pl"),am=parseFloat(getComputedStyle(w).getPropertyValue("--am"))||100;need=Math.max(need,ls?pl.offsetHeight+44:pl.offsetHeight+am+30+26+12)});
 RT.style.setProperty("--k",Math.max(.72,Math.min(1,H/need)).toFixed(3))}
size();addEventListener("resize",size);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(size);
const BG=[$("#bgA"),$("#bgB")];let bgI=0;BG[0].classList.add("on");
function setBg(c){const n=BG[bgI^1],o=BG[bgI];n.style.setProperty("--c",c);n.classList.add("on");o.classList.remove("on");bgI^=1}
function setAct(a){act=a;setBg(C[a]);walls.forEach((w,i)=>{w.classList.toggle("on",i===a);w.inert=i!==a});$$("#dr button").forEach((b,i)=>b.classList.toggle("on",i===a));document.body.style.setProperty("--c",C[a]);$("#hn").textContent=pad(a+1);$("#hs").textContent=K[a].n;$("#dc").textContent=pad(a+1)}
const go=k=>{const c=Math.round(pos),h=Math.floor(N/2);tg=c+((k-c+h)%N+N)%N-h};
function fr(){requestAnimationFrame(fr);if(busy)return;const mv=pos!==tg||zo>.5;
 if(pos!==tg){pos+=(tg-pos)*(RM?1:.075);if(Math.abs(tg-pos)<.0006)pos=tg}if(zo>.5){zo*=.93;if(zo<.5)zo=0}
 if(Math.abs(my*-4-rx)>.004||Math.abs(mx*6-ry)>.004){rx+=(my*-4-rx)*.07;ry+=(mx*6-ry)*.07;tl.style.transform=`rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg)`}
 if(mv||dirty){dirty=0;ring.style.transform=`translateZ(${zc-zo}px) rotateY(${-pos*SA}deg)`;dial.style.transform=`rotate(${-pos*SA}deg)`;
  walls.forEach((w,i)=>{const d=((i-pos+N/2)%N+N)%N-N/2,v=Math.abs(d)<1.45;if(w._v!==v){w._v=v;w.style.visibility=v?"visible":"hidden"}});
  const a=((Math.round(pos)%N)+N)%N;if(a!==act)setAct(a)}}
requestAnimationFrame(fr);
// Input: scorri, trascina la scena, ruota il quadrante, frecce
addEventListener("wheel",e=>{if(busy)return;tg+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*.0016;clearTimeout(snap);snap=setTimeout(()=>tg=Math.round(tg),160)},{passive:true});
$("#sc").addEventListener("pointerdown",e=>{if(!busy&&!e.target.closest("button,a"))drag={x:e.clientX,t:tg,m:0}});
const dl=$("#dl"),ang=e=>{const b=dl.getBoundingClientRect();return Math.atan2(e.clientY-b.top-b.height/2,e.clientX-b.left-b.width/2)*180/Math.PI};
dl.addEventListener("pointerdown",e=>{if(busy)return;dd={l:ang(e),s:0,t:tg,m:0};dl.setPointerCapture(e.pointerId)});
addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;
 if(drag){const dx=e.clientX-drag.x;drag.m=Math.max(drag.m,Math.abs(dx));tg=drag.t-dx/380}
 if(dd){const a=ang(e);let d=((a-dd.l+540)%360)-180;dd.l=a;dd.s+=d;dd.m=Math.max(dd.m,Math.abs(dd.s));tg=dd.t-dd.s/SA}});
addEventListener("pointerup",e=>{if(dd&&dd.m<=5){const t=document.elementFromPoint(e.clientX,e.clientY),b=t&&t.closest("[data-g]");if(b)go(+b.dataset.g)}if((drag&&drag.m>5)||(dd&&dd.m>5)){blk=1;setTimeout(()=>blk=0,80)}if(drag||dd){tg=Math.round(tg);drag=dd=null}});
function sheet(i){const k=K[i];$("#ds").innerHTML=`<button class="bt x" data-a="xs" type="button">Chiudi</button><span class="mono">${pad(i+1)} / ${pad(N)}${k.nuovo?" · Nuovo":""}</span><h3>${k.n}</h3><p class="ld2">${k.l}</p><div class="bd"><div><span>Valore dei singoli servizi</span><b>${eur(k.val)}</b></div><div><span>Sconto</span><b>−${k.sc}%</b></div><div><span>Risparmio</span><b>${eur(k.ris)}</b></div><div class="tt"><span>Prezzo finale</span><b>${eur(k.pr)}</b></div></div><div class="mt" style="--f:${(k.pr/k.val).toFixed(3)};margin-top:18px"><i></i></div><p class="cp">Prezzo del pacchetto rispetto al valore dei singoli servizi</p><div class="inc"><span class="mono">Cosa include</span><ol>${k.sv.map(s=>`<li><b>${s}</b><span>${(k.sdo&&k.sdo[s])||SD[s]||""}${k.lk&&k.lk[s]?` <a href="${k.lk[s][0]}">Guarda il concept →</a>`:""}</span></li>`).join("")}</ol></div><div class="dly"><span class="mono">Tempi di consegna</span><p class="dh"><b>3${DSH}5 giorni</b><em>indicativi</em></p><p class="dl">Una stima orientativa, non una scadenza garantita.</p><ul><li><b>Anche prima</b><span>Alcuni pacchetti possono essere completati e consegnati in meno tempo.</span></li><li><b>Anche oltre</b><span>In altri casi la consegna può richiedere più di 5 giorni.</span></li><li><b>Da cosa dipende</b><span>Dal numero di richieste e di progetti in gestione e dalla complessità dei servizi inclusi nel pacchetto.</span></li></ul><p class="dn">Per un’indicazione più precisa sul tuo caso, scrivici dalla richiesta di informazioni.</p></div>${k.ex.map(e=>`<a href="${e[0]}">→ Guarda un concept dimostrativo: ${e[1]}</a>`).join("")}<p style="margin-top:20px"><button class="bt p" data-a="rq" data-i="${i}" type="button">Richiedi informazioni</button></p>`;$("#ds").classList.add("on");busy=1;$("#ds .x").focus()}
// Tema
const root=document.documentElement;function setTheme(t,s){root.dataset.theme=t;$("#thl").textContent=t==="light"?"Tema scuro":"Tema chiaro";if(s)try{localStorage.setItem("mv-theme",t)}catch(e){}}
setTheme(root.dataset.theme==="light"?"light":"dark");
$("#bth").onclick=()=>{const t=root.dataset.theme==="light"?"dark":"light";if(matchMedia("(prefers-reduced-motion:reduce)").matches||!document.startViewTransition){setTheme(t,1);return}document.startViewTransition(()=>setTheme(t,1))};
// Approfondimenti e richiesta
let cur=-1;const dlg=$("#dlg");
const sum=()=>{const k=K[cur];return cur<0?"Richiesta di informazioni sui pacchetti MANDAVEL (non so ancora quale scegliere).":`Richiesta di informazioni — Pacchetto ${k.n}\nServizi: ${k.sv.join(", ")}\nPrezzo finale: ${eur(k.pr)} (valore dei singoli servizi ${eur(k.val)}, sconto ${k.sc}%, risparmio ${eur(k.ris)})`};
const full=()=>sum()+($("#dmsg").value.trim()?"\n\nLa mia attività: "+$("#dmsg").value.trim():"");
function openDlg(i){cur=i;$("#dh").textContent=i<0?"Quale pacchetto fa per te?":K[i].n;$("#dsum").textContent=sum();$("#dmsg").value="";
 const m=$("#dml");m.hidden=!(CONTATTO.email||CONTATTO.url);if(CONTATTO.email){m.textContent="Invia per email";m.removeAttribute("target")}else if(CONTATTO.url){m.textContent="Vai al contatto";m.href=CONTATTO.url;m.target="_blank";m.rel="noopener"}
 $("#dnote").innerHTML=m.hidden?"Copia il riepilogo e invialo al recapito MANDAVEL che preferisci.":"Domande generali: <a href=\"mailto:hello@mandavel.it\">hello@mandavel.it</a> · Clienti: <a href=\"mailto:clients@mandavel.it\">clients@mandavel.it</a>";dlg.classList.add("on");busy=1;if(matchMedia("(hover:hover)").matches)$("#dmsg").focus()}
$("#dml").addEventListener("click",()=>{if(CONTATTO.email)$("#dml").href="mailto:"+CONTATTO.email+"?subject="+encodeURIComponent(cur<0?"Richiesta informazioni pacchetti":"Richiesta informazioni: "+K[cur].n)+"&body="+encodeURIComponent(full())});
$("#dcp").onclick=async()=>{try{await navigator.clipboard.writeText(full());$("#dcp").textContent="Copiato ✓"}catch(e){$("#dsum").textContent=full();$("#dcp").textContent="Seleziona e copia"}setTimeout(()=>$("#dcp").textContent="Copia la richiesta",2200)};
const close=()=>{dlg.classList.remove("on");busy=$("#ds").classList.contains("on")?1:0};$("#dx").onclick=close;dlg.addEventListener("click",e=>{if(e.target===dlg)close()});addEventListener("keydown",e=>{if(e.key==="Escape")close()});

addEventListener("keydown",e=>{if(e.key==="Escape"){$("#ds").classList.remove("on");busy=0;return}if(busy)return;const k=e.key;
 if(["ArrowRight","ArrowDown","PageDown"].includes(k))tg=Math.round(tg)+1;else if(["ArrowLeft","ArrowUp","PageUp"].includes(k))tg=Math.round(tg)-1;else if(/^[1-7]$/.test(k))go(+k-1)});
document.addEventListener("click",e=>{if(blk)return;const b=e.target.closest("[data-a],[data-g]");if(!b)return;if(b.dataset.g!==undefined){go(+b.dataset.g);return}
 const a=b.dataset.a;if(a==="rq")openDlg(+b.dataset.i);else if(a==="ds")sheet(+b.dataset.i);else if(a==="xs"){$("#ds").classList.remove("on");busy=dlg.classList.contains("on")?1:0}});
</script>
