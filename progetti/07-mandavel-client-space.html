<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mandavel Client Space</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">

</head>
<body>
<style>
:root{
  /* DIREZIONE ARTISTICA — "Tavole".
     Il portale è letto come un fascicolo di tavole di progetto steso attorno a una maquette.
     Regole del sistema:
     - FORMA: ciò che è carta (tavole, righe, controlli, etichette) ha angoli vivi (2px) e filetti da 1px.
              Ciò che è strumento (sestante, anello delle fasi, bussola di luce) è circolare.
     - TIPO:  Bodoni Moda tondo per titoli e cifre, corsivo solo per numeri e voce attiva; Schibsted Grotesk per il testo;
              DM Mono per quote, codici, date, etichette tecniche.
     - COLORE: la maquette è gesso su notte. Gli unici colori sono gli stati: ambra = serve il cliente, azzurro = in corso,
              verde = fatto, grigio = in pausa, rosso = errore. Nessun altro colore decorativo.
     - MOTO:  una sola famiglia di curve e quattro durate (--d1..--d4); il movimento comunica un cambiamento o guida l'attenzione. */
  --night:#13151D; --night-deep:#0B0C11; --ink:#EDE8DE; --ink-2:#D8D3C7; --muted:#A8ABB7; --faint:#7E818E;
  --line:rgba(237,232,222,.14); --line-2:rgba(237,232,222,.34); --line-3:rgba(237,232,222,.6);
  --glass:rgba(17,18,26,.94); --hover:rgba(237,232,222,.06);
  --paper:#ECE7DB; --paper-ink:#1D1E25; --paper-mute:#5A5B64; --paper-line:#C9C3B4;
  --ok:#8FD3A9; --ok-bg:rgba(143,211,169,.12);
  --run:#86BDF0; --run-bg:rgba(134,189,240,.12);
  --wait:#F2B84B; --wait-bg:rgba(242,184,75,.13);
  --bad:#F2897B; --bad-bg:rgba(242,137,123,.13);
  --hold:#AEB8C4; --hold-bg:rgba(174,184,196,.12);
  --pool-rgb:201,137,63; --pool-x:24%; --pool-y:80%; --beam:104deg;
  --sx:-14px; --sy:26px;
  --font-display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --font-body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:2px;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-io:cubic-bezier(.65,0,.35,1);
  --d1:140ms; --d2:260ms; --d3:560ms; --d4:900ms;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--ink);font:15px/1.55 var(--font-body);overflow:hidden;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night-deep);z-index:60}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--wait);outline-offset:3px;border-radius:var(--r)}
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:90;background:var(--ink);color:#14151C;border:0;padding:10px 16px;border-radius:var(--r);font-weight:600;cursor:pointer;transition:top var(--d2) var(--ease)}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.ic{width:18px;height:18px;flex:none}

/* ---------- stage ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
   radial-gradient(70% 60% at var(--pool-x) var(--pool-y),rgba(var(--pool-rgb),.24),transparent 70%),
   radial-gradient(110% 80% at 50% -10%,#2A2E3E,transparent 62%),
   linear-gradient(180deg,#151720 0%,#0C0D12 100%);
  transition:background-position .6s}
.bg::before{content:"";position:absolute;inset:-20%;background:linear-gradient(var(--beam),transparent 28%,rgba(255,226,180,.07) 42%,rgba(255,226,180,.02) 52%,transparent 64%)}
.bg::after{content:"";position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:fixed;inset:0;z-index:2;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.ui>*{pointer-events:auto}

/* ---------- top ---------- */
.strip{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:30;pointer-events:none;display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.strip .s{display:none}.strip>span{font:500 11px/1.3 var(--font-mono);letter-spacing:.07em;color:#111218;background:var(--wait);padding:3px 12px;border-radius:0 0 var(--r) var(--r);text-align:center;margin-top:-6px;padding-top:9px}
.top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 22px);z-index:25;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(22px,env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:38px;height:38px;color:var(--ink);flex:none}
.brand b{display:block;font:italic 400 28px/1 var(--font-display);letter-spacing:.005em}
.brand small{display:block;font:400 11.5px var(--font-mono);letter-spacing:.03em;color:var(--muted);margin-top:5px;white-space:nowrap}
.brand small b{display:inline;font:500 11.5px var(--font-mono);color:var(--ink)}
.areatag{display:inline-block;font:500 11px var(--font-mono);letter-spacing:.06em;color:#111218;background:var(--run);padding:1px 8px;border-radius:var(--r);margin-right:6px}
.tr{display:flex;align-items:center;gap:8px;position:relative;flex-wrap:wrap;justify-content:flex-end}
.chip-role{font:500 11.5px var(--font-mono);letter-spacing:.05em;color:var(--muted);border:1px solid var(--line-2);padding:6px 10px;border-radius:var(--r);background:rgba(15,16,22,.7)}
.pbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r);background:rgba(15,16,22,.78);border:1px solid var(--line-2);color:var(--ink);cursor:pointer;font-weight:600;font-size:13px;transition:border-color var(--d1),background var(--d1),transform var(--d1)}
.pbtn:hover{border-color:var(--ink);background:rgba(30,32,44,.92)}
.pbtn:active{transform:translateY(1px)}
.pbtn[aria-expanded="true"]{background:var(--ink);color:#14151C;border-color:var(--ink)}
@media (max-width:899px){.strip .l{display:none}.strip .s{display:inline}.chip-role{display:none}.pbtn .t{display:none}.pbtn{width:44px;height:44px;padding:0;justify-content:center}.brand small{display:none}.brand b{font-size:24px}.brand svg{width:32px;height:32px}}
.tools{position:absolute;right:0;top:calc(100% + 10px);z-index:40;width:min(380px,calc(100vw - 32px));background:var(--glass);border:1px solid var(--line-2);border-radius:var(--r);padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.6);backdrop-filter:blur(14px);animation:drop var(--d2) var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tools h2,.tools h3{font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 8px 6px}
.tools .tb{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:var(--r);min-height:44px;padding:6px 8px;cursor:pointer;font-size:14px;color:var(--ink);transition:background var(--d1)}
.tools .tb:hover{background:var(--hover)}
.tools .on{font:500 11px var(--font-mono);margin-left:auto;color:var(--wait)}
.tools hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.keysl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:4px 8px 8px;font-size:13px;color:var(--ink-2);align-items:center}
.keysl dt{white-space:nowrap}.keysl dd{margin:0}
.keysl kbd{font:500 11.5px var(--font-mono);border:1px solid var(--line-2);border-radius:var(--r);padding:1px 7px;color:var(--ink);justify-self:start;background:rgba(237,232,222,.05)}
.prevbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 84px);z-index:24;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;max-width:min(680px,calc(100vw - 32px));padding:8px 8px 8px 16px;border-radius:var(--r);background:var(--run);color:#10151C;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.prevbar .btn{background:rgba(255,255,255,.55);border-color:transparent;color:#10151C;min-height:34px}
@media (max-width:899px){.prevbar{top:calc(env(safe-area-inset-top,0px) + 74px)}}

/* light dock: a small instrument, so it is round */
.dock{position:fixed;left:max(22px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 100px);z-index:22;display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:99px;background:rgba(15,16,22,.7);padding:3px}
.seg button{border:0;background:none;color:var(--muted);min-height:34px;padding:0 12px;border-radius:99px;cursor:pointer;font:500 12.5px var(--font-body);display:inline-flex;align-items:center;gap:6px;transition:color var(--d1),background var(--d1)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#14151C}
.seg .sw{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.9}
.rot{display:flex;gap:4px}
.rot button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:rgba(15,16,22,.7);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:border-color var(--d1),transform var(--d2) var(--ease)}
.rot button:hover{border-color:var(--ink)}
.rot button:active{transform:rotate(-22deg)}
.rot button[data-dir="1"]:active{transform:rotate(22deg)}
.dock.d{display:flex}.dock .lb{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tools .dock-in{padding:6px 8px 8px;display:grid;gap:10px}
.tools .dock-in .seg{flex-wrap:wrap;border-radius:14px}
.tools .dock-in .lb{display:block}
@media (max-width:899px){.dock.d{display:none}}
@media (min-width:900px){.tools .dock-in,.tools .dock-hr{display:none}}
.glfail{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:12;max-width:34ch;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line-2);padding:12px 16px;border-radius:var(--r);background:rgba(15,16,22,.7)}

/* ---------- sheet (a drawing sheet, stacked on two others) ---------- */
.sheet{position:fixed;z-index:18;isolation:isolate;top:calc(env(safe-area-inset-top,0px) + 92px);right:max(20px,env(safe-area-inset-right,0px));bottom:20px;width:clamp(430px,38vw,620px);
  display:flex;flex-direction:column;min-height:0;border-radius:var(--r);border:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(24,26,36,.95),rgba(14,15,21,.96));backdrop-filter:blur(12px);
  box-shadow:var(--sx) var(--sy) 70px rgba(0,0,0,.55);transition:box-shadow 1.2s}
.sheet::before,.sheet::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:var(--r);border:1px solid var(--line);background:rgba(24,26,36,.6);pointer-events:none}
.sheet::before{transform:translate(-8px,8px);opacity:.8}
.sheet::after{transform:translate(-16px,16px);opacity:.45}
.sheet-in{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:28px clamp(20px,3vw,34px) 34px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;scroll-behavior:smooth}
.sheet-in>*+*{margin-top:34px}
.sheet-in>.head+*{margin-top:26px}
.grab{display:none}
/* cartiglio: where am I, what is this sheet, how far along is the project */
.cart{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;padding:10px clamp(20px,3vw,34px) 11px;border-top:1px solid var(--line-2);font:400 11.5px var(--font-mono);letter-spacing:.04em;color:var(--muted)}
.cart b{font-weight:500;color:var(--ink)}
.cart .tv{font-size:12px;color:var(--ink);white-space:nowrap}
.cart .tv i{font-style:normal;color:var(--muted)}
.cart .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart .pc{white-space:nowrap}
.sheet.enter{animation:sheetIn var(--d3) var(--ease) backwards}
@keyframes sheetIn{from{clip-path:inset(0 0 0 100%);opacity:.4}to{clip-path:inset(0 0 0 0);opacity:1}}
.sheet.enter .sheet-in>*{animation:rise var(--d3) var(--ease) both}
.sheet.enter .sheet-in>*:nth-child(1){animation-delay:.14s}.sheet.enter .sheet-in>*:nth-child(2){animation-delay:.2s}.sheet.enter .sheet-in>*:nth-child(3){animation-delay:.26s}
.sheet.enter .sheet-in>*:nth-child(4){animation-delay:.32s}.sheet.enter .sheet-in>*:nth-child(n+5){animation-delay:.38s}
@keyframes rise{from{opacity:.001;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}

/* heading block: a drawing label, tav number then a hairline */
.head .kicker,.kicker{display:flex;align-items:center;gap:10px;font:500 11.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kicker b{font-weight:500;color:var(--ink)}
.kicker::after{content:"";flex:1;height:1px;background:var(--line-2);max-width:120px;transform-origin:0 50%}
.sheet.enter .kicker::after,.stage-hero.enter .kicker::after{animation:draw var(--d4) var(--ease) .1s backwards}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
h1{font:400 clamp(34px,3.4vw,50px)/1.04 var(--font-display);letter-spacing:-.012em;text-wrap:balance;margin-top:12px}
h1 em{font-style:italic}
.lede{color:var(--ink-2);max-width:56ch;margin-top:14px;font-size:16px;line-height:1.6}
.sec>h2{font:500 11.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.sec>h2 .c{color:var(--muted);margin-left:8px}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:6px}

/* buttons: paper, so square */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line-2);background:rgba(237,232,222,.05);color:var(--ink);font-weight:600;font-size:14px;line-height:1.2;cursor:pointer;text-decoration:none;transition:background var(--d1),border-color var(--d1),color var(--d1),transform var(--d1)}
.btn .ic{transition:transform var(--d2) var(--ease)}
.btn:hover{border-color:var(--ink);background:rgba(237,232,222,.12)}
.btn:hover .ic:last-child{transform:translateX(2px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#14151C}
.btn.primary:hover{background:#fff}
.btn.warn{background:var(--wait);border-color:var(--wait);color:#1b1405}
.btn.warn:hover{background:#ffcb6a}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(237,232,222,.07) 6px 7px)}
.btn:disabled:hover{border-color:var(--line-2);transform:none}
.btn.linklike{border:0;background:none;padding:0;min-height:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;justify-content:flex-start;text-align:left}
.btn.linklike:hover{text-decoration-color:var(--ink);background:none}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* state labels: outline + glyph, so colour is never the only signal */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:var(--r);font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.5;border:1px solid transparent}
.badge .ic{width:15px;height:15px}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:rgba(143,211,169,.35)}
.badge.run{background:var(--run-bg);color:var(--run);border-color:rgba(134,189,240,.35)}
.badge.wait{background:var(--wait-bg);color:var(--wait);border-color:rgba(242,184,75,.4)}
.badge.hold{background:var(--hold-bg);color:var(--hold);border-color:rgba(174,184,196,.35)}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:rgba(242,137,123,.4)}
.badge.info{background:rgba(237,232,222,.07);color:var(--ink-2);border-color:var(--line-2)}
.badge.idle{border:1px dashed var(--line-2);color:var(--muted)}
.fresh{display:inline-block;font:500 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:#14151C;background:var(--ink);border-radius:var(--r);padding:0 6px;margin-left:8px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink-2)}

/* lists */
.line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line strong{display:block;font-weight:600}
.due{font:500 12.5px var(--font-mono);color:var(--wait)}
.empty{display:flex;gap:14px;align-items:flex-start;padding:20px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--ink-2);max-width:70ch}
.empty .ic{width:24px;height:24px;color:var(--muted);margin-top:2px}
.empty strong{display:block;color:var(--ink);margin-bottom:2px}
.callout{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px;background:var(--wait-bg);color:var(--wait);border-radius:var(--r);font-weight:600;border:1px solid rgba(242,184,75,.35);border-left-width:3px}
.feed .post{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 20px;padding:22px 0;border-top:1px solid var(--line)}
.feed .post:first-child{border-top:0;padding-top:4px}
.post time{font:500 12px var(--font-mono);letter-spacing:.03em;color:var(--muted);padding-top:6px}
.post h3{font:400 22px/1.2 var(--font-display);margin-bottom:6px}
.post p{color:var(--ink-2)}
.post .by{margin-top:8px;font:400 12px var(--font-mono);color:var(--muted)}
.post .refs{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:13px}
@media (max-width:640px){.feed .post{grid-template-columns:minmax(0,1fr)}}

/* timeline: the line is drawn when the sheet opens */
.tl{position:relative}
.tl-item{display:grid;grid-template-columns:46px minmax(0,1fr);gap:0 18px;padding-bottom:30px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:22px;top:46px;bottom:-2px;width:1px;background:var(--line-2);transform-origin:50% 0}
.sheet.enter .tl-item::before{animation:drawY var(--d4) var(--ease) calc(var(--i,0) * 90ms + 200ms) backwards}
@keyframes drawY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.tl-item:last-child::before{display:none}
.tl-item.ok::before{background:var(--ink)}
.tl-node{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#171922;border:1.5px solid var(--line-2);color:var(--muted);z-index:1;font:italic 400 22px var(--font-display);transition:transform var(--d2) var(--ease),border-color var(--d1)}
.tl-item:hover .tl-node,.tl-item.pulse .tl-node{transform:scale(1.08)}
.tl-item.pulse,.row.pulse{animation:pulseRow 1.6s var(--ease)}
@keyframes pulseRow{0%{background:rgba(242,184,75,.16)}100%{background:transparent}}
.tl-item.ok .tl-node{background:var(--ink);border-color:var(--ink);color:#14151C}
.tl-item.run .tl-node{border-color:var(--run);color:var(--run)}
.tl-item.wait .tl-node{border-color:var(--wait);color:var(--wait);background:var(--wait-bg)}
.tl-item.hold .tl-node{border-color:var(--hold);color:var(--hold)}
.tl-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px}
.tl-head h3{font:400 24px/1.1 var(--font-display)}
.tl-body p{color:var(--ink-2);margin-top:6px;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:12px}

.meta dd{font:400 13.5px var(--font-mono)}
.tl-act{margin-top:12px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--wait);font-weight:600}

/* documents: a register of "elaborati", each with its code */
.doc{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:18px 0 18px 14px;border-top:1px solid var(--line);position:relative;transition:background var(--d2)}
.doc:first-child{border-top:0}
.doc::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;background:var(--line-2);transform-origin:0 0;transition:background var(--d2),transform var(--d2) var(--ease)}
.doc:hover{background:var(--hover)}
.doc.need::before{background:var(--wait)}
.doc.gone::before{background:var(--bad)}
.doc .dc{font:500 12px var(--font-mono);letter-spacing:.04em;color:var(--muted);padding-top:5px}
.doc.need .dc{color:var(--wait)}.doc.gone .dc{color:var(--bad)}
.doc h3{font:400 21px/1.2 var(--font-display)}
.doc .sub{font:400 12px var(--font-mono);color:var(--muted);margin-top:4px}
.doc p.d{font-size:14px;color:var(--ink-2);margin-top:6px;max-width:60ch}
.doc .end{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:640px){.doc{grid-template-columns:44px minmax(0,1fr)}.doc .end{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:var(--r);padding:clamp(20px,4vw,38px);box-shadow:8px 18px 40px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.1);position:relative}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.3),transparent 30%)}
.paper h1{font-size:clamp(28px,3vw,38px);margin:8px 0 6px;color:var(--paper-ink)}
.paper .stamp{font:500 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--paper-mute)}
.paper ul{margin-top:20px;display:grid;gap:10px}
.paper li{padding-left:18px;position:relative;max-width:60ch}
.paper li::before{content:"";position:absolute;left:0;top:.72em;width:8px;height:1.5px;background:var(--paper-ink)}
.paper table{width:100%;border-collapse:collapse;margin-top:20px;font-variant-numeric:tabular-nums}
.paper td,.paper th{padding:10px 0;border-top:1px solid var(--paper-line);text-align:left;font-weight:400}
.paper td:last-child,.paper th:last-child{text-align:right;font-family:var(--font-mono);font-size:14px}
.paper tfoot th{font-weight:700;border-top:2px solid var(--paper-ink)}
.paper .note{margin-top:22px;font-size:13px;color:var(--paper-mute);padding-top:14px;border-top:1px dashed var(--paper-line)}
.paper .badge.ok{background:#CFE6D6;color:#1F5A38;border-color:#9CC9AA}.paper .badge.wait{background:#F6E2B6;color:#6B4403;border-color:#DDB86A}.paper .badge.info{background:#E2DDCF;color:#3B3C45;border-color:#C9C3B4}.paper .badge.bad{background:#F4D5D0;color:#8A2D23;border-color:#E0A79E}
.paper .lede,.paper p{color:var(--paper-mute)}
.apv{margin-top:6px}

/* orders: an "abaco" (schedule). One ruled row per piece, no card, no pictogram */
.aba{display:grid}
.oc{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 16px;padding:20px 0 20px 14px;border-top:1px solid var(--line);position:relative;transition:background var(--d2)}
.oc:first-child{border-top:0}
.oc::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:2px;background:var(--line-2);transition:background var(--d2),top var(--d2) var(--ease),bottom var(--d2) var(--ease)}
.oc:hover,.oc:focus-within{background:var(--hover)}
.oc:hover::before,.oc:focus-within::before{top:12px;bottom:12px;background:var(--ink)}
.oc.need::before{background:var(--wait)}
.oc.pulse{animation:pulseRow 1.6s var(--ease)}
.oc .bd{display:grid;gap:8px;min-width:0}
.oc .code{font:500 12px var(--font-mono);letter-spacing:.04em;color:var(--muted);padding-top:5px}
.oc.need .code{color:var(--wait)}
.oc .hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:6px 12px}
.oc h3{font:400 21px/1.2 var(--font-display)}
.oc .cat{font:500 10.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.oc p.d{font-size:14px;color:var(--ink-2);max-width:56ch}
.oc .row2{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.steps{display:flex;gap:3px;align-items:center}
.steps i{display:block;width:18px;height:3px;background:var(--line-2)}
.steps i.f{background:var(--ink)}
.kv{display:flex;flex-wrap:wrap;gap:2px 18px;font:400 12px var(--font-mono);color:var(--muted)}
.kv b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.note-o{font:500 12.5px var(--font-mono);color:var(--wait)}
.oc .btn{justify-self:start}

/* actions: decisions, with a rule instead of a box */
.acts{display:grid}
.act{padding:20px 0 20px 16px;border-top:1px solid var(--line);display:grid;gap:10px;position:relative}
.act:first-child{border-top:0}
.act::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:2px;background:var(--line-2)}
.act.open::before{background:var(--wait)}
.act.just{animation:pulseRow 1.8s var(--ease)}
.act-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:flex-start}
.act h3{font:400 22px/1.2 var(--font-display)}
.act p{color:var(--ink-2);max-width:62ch}
.act .links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.confirm{margin-top:4px;padding:16px;border:1px solid var(--ink);border-radius:var(--r);background:rgba(237,232,222,.07);display:grid;gap:10px;animation:rise var(--d2) var(--ease) both}
.confirm p{font-size:14px;color:var(--ink)}

/* admin */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.quick .btn{justify-content:flex-start;text-align:left;min-height:60px;padding:0 16px}
.quick .btn small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
.quick .btn.primary small{color:#43454f}
.counts{display:flex;flex-wrap:wrap;gap:10px 28px}
.counts b{display:block;font:400 40px/1 var(--font-display);font-variant-numeric:tabular-nums}
.counts span{font:400 11.5px var(--font-mono);letter-spacing:.03em;color:var(--muted)}
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:12px 24px;padding:18px 0 18px 14px;border-top:1px solid var(--line);align-items:start;position:relative;transition:background var(--d2)}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;background:var(--line-2)}
.row:hover{background:var(--hover)}
.row .idx{font:500 10.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row h3{font:400 21px/1.2 var(--font-display);margin-top:3px}
.row p{font-size:14px;color:var(--ink-2);margin-top:2px;max-width:54ch}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px}
.ctl label{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ctl .full{grid-column:1/-1}
.hint{grid-column:1/-1;font-size:13px;color:var(--wait);font-weight:600;margin-top:4px}
@media (max-width:1100px){.row{grid-template-columns:minmax(0,1fr)}}
select,input[type=text],input[type=date],textarea,input[type=file]{width:100%;min-height:44px;padding:8px 10px;background:rgba(10,11,16,.7);border:1px solid var(--line-2);border-radius:var(--r);font-size:15px;color:var(--ink);color-scheme:dark;transition:border-color var(--d1),background var(--d1)}
select:hover,input:hover,textarea:hover{border-color:var(--line-3)}
select option{background:#1B1D27;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.45}
select:disabled{opacity:.55;cursor:not-allowed}
input[aria-invalid="true"],textarea[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;border:1px solid var(--line-2);border-radius:var(--r);padding:clamp(16px,3vw,22px)}
.form .f{display:grid;gap:6px;align-content:start;min-width:0}
.form .f.full,.form .full{grid-column:1/-1}
.form label{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.form .help{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.err::before{content:"✕ "}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
.log li{display:grid;grid-template-columns:140px minmax(0,1fr);gap:2px 16px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log time{font:500 11.5px var(--font-mono);color:var(--muted)}
@media (max-width:640px){.log li{grid-template-columns:minmax(0,1fr)}}

/* states, about */
.state{display:grid;gap:14px;max-width:520px}
.state .big{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--bad-bg);color:var(--bad);border:1px solid rgba(242,137,123,.4)}
.state .big.w{background:var(--wait-bg);color:var(--wait);border-color:rgba(242,184,75,.4)}
.state .big .ic{width:28px;height:28px}
.state p{color:var(--ink-2)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.cols2 li{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-2)}
.about dl{display:grid;margin-top:4px}
.about dt{font:500 11.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;margin-top:18px;color:var(--ink)}
.about dd{color:var(--ink-2);max-width:62ch;margin-top:3px}
.notice{display:flex;gap:12px;font-size:13.5px;color:var(--ink-2);padding:12px 14px;border-left:3px solid var(--wait);background:var(--wait-bg);border-radius:0 var(--r) var(--r) 0}
.notice .ic{color:var(--wait);margin-top:2px}

/* ---------- login: two keys, no card ---------- */
.stage-hero{position:fixed;z-index:18;left:max(22px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 150px);width:min(540px,42vw);display:grid;gap:26px;max-height:calc(100% - 190px);overflow-y:auto;padding-right:6px;scrollbar-width:none}
.stage-hero h1{font-size:clamp(36px,4.4vw,66px);line-height:1}
.stage-hero.enter>*{animation:rise var(--d3) var(--ease) both}
.stage-hero.enter>*:nth-child(2){animation-delay:.12s}.stage-hero.enter>*:nth-child(3){animation-delay:.24s}.stage-hero.enter>*:nth-child(4){animation-delay:.36s}
.keys{display:grid;border-top:1px solid var(--line-3)}
.key{position:relative;text-align:left;border:0;border-bottom:1px solid var(--line-2);padding:18px 8px 18px 0;background:none;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 14px;align-items:center;color:var(--ink);transition:background var(--d2),padding var(--d2) var(--ease)}
.key::before{content:attr(data-k);grid-row:1/3;font:italic 400 34px/1 var(--font-display);color:var(--muted);transition:color var(--d2)}
.key h2{font:400 26px/1.1 var(--font-display)}
.key p{color:var(--ink-2);font-size:14px;max-width:44ch;grid-column:2}
.key .go{grid-column:3;grid-row:1/3;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap}
.key .go span{max-width:0;overflow:hidden;opacity:0;transition:max-width var(--d3) var(--ease),opacity var(--d2)}
.key:hover,.key:focus-visible{background:linear-gradient(90deg,rgba(237,232,222,.08),transparent);padding-left:10px}
.key:hover::before,.key:focus-visible::before{color:var(--ink)}
.key:hover .go span,.key:focus-visible .go span{max-width:120px;opacity:1}
.path{display:grid;gap:8px;counter-reset:s}
.path li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;font-size:14px;color:var(--ink-2)}
.path li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font:500 12px/1.9 var(--font-mono);color:var(--muted)}

/* ---------- overview: title on the left, margin notes on the right ---------- */
.hud{position:fixed;z-index:18;inset:calc(env(safe-area-inset-top,0px) + 96px) max(22px,env(safe-area-inset-right,0px)) 22px max(22px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr) minmax(330px,390px);gap:24px;pointer-events:none}
.hud>*{pointer-events:auto;min-height:0}
.hud .col-l{display:grid;align-content:start;gap:20px;padding-top:56px;overflow:hidden}
.hud .col-l h1{font-size:clamp(38px,4.2vw,64px);line-height:.98}
.hud .col-r{grid-column:3;display:block;overflow-y:auto;padding:4px 14px 40px 22px;scrollbar-width:none;border-left:1px solid var(--line-2);
  background:linear-gradient(90deg,rgba(11,12,17,.55),rgba(11,12,17,.95) 36px);-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 40px),transparent)}
.pctline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pctline b{font:italic 400 52px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pctline span{color:var(--ink-2);font:400 12.5px var(--font-mono);letter-spacing:.02em}
.cap{font:400 12px/1.5 var(--font-mono);color:var(--muted);max-width:46ch}
.ticks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:420px}
.tick{display:grid;gap:6px;min-width:0;cursor:default}
.tick .bar{display:block;height:5px;border:1px solid var(--line-2);transition:transform var(--d2) var(--ease)}
.tick:hover .bar{transform:scaleY(1.8)}
.tick.ok .bar{background:var(--ink);border-color:var(--ink)}
.tick.run .bar{background:var(--run);border-color:var(--run)}
.tick.wait .bar{background:var(--wait);border-color:var(--wait)}
.tick.hold .bar{background:var(--hold);border-color:var(--hold)}
.tick.idle .bar{border-style:dashed}
.tick .nm{font:italic 400 15px/1 var(--font-display);color:var(--muted)}
.tick.ok .nm,.tick.run .nm,.tick.wait .nm{color:var(--ink)}
.plate{position:relative;padding:20px 0 20px;border-top:1px solid var(--line)}
.plate:first-child{border-top:0;padding-top:12px}
.plate.hot::before{content:"";position:absolute;left:-23px;top:14px;bottom:20px;width:3px;background:var(--wait)}
.plate:first-child.hot::before{top:6px}
.plate h2{font:500 11px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.plate.hot h2{color:var(--wait)}
.plate h3{font:400 24px/1.15 var(--font-display)}
.plate .line:first-of-type{border-top:0;padding-top:6px}
.plate p{color:var(--ink-2);font-size:14px}
.plate .nx{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.plate .post{display:block;border:0;padding:0}
.plate .post time{display:block;margin-bottom:4px;padding:0}
.plate .post h3{font-size:19px}
.plates{display:grid}
.plates .plate{padding-right:0}
.plates .plate.hot::before{left:-14px}

/* ---------- sextant ---------- */
.sext{position:fixed;left:0;bottom:0;z-index:28;width:520px;height:480px;pointer-events:none;--R:232px;--pl:max(34px,calc(env(safe-area-inset-left,0px) + 20px));--pb:max(34px,calc(env(safe-area-inset-bottom,0px) + 20px))}
.sext::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--pl) calc(100% - var(--pb)),rgba(8,9,13,.94),rgba(8,9,13,.72) 42%,rgba(8,9,13,0) 76%)}
.sext .limb{position:absolute;left:var(--pl);bottom:var(--pb);width:0;height:0;overflow:visible}
.sext .limb path{fill:none;stroke:var(--line-2);stroke-width:1}
.sext .limb .tk{stroke:rgba(237,232,222,.28)}
.sext .limb .tk2{stroke:rgba(237,232,222,.55)}
.hub{position:absolute;left:calc(var(--pl) - 9px);bottom:calc(var(--pb) - 9px);width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);background:var(--night-deep);box-shadow:0 0 0 5px rgba(237,232,222,.08)}
.piv,.sext .cur{display:none}
.sext .limb.m{display:none}
.needle{position:absolute;left:var(--pl);bottom:var(--pb);width:var(--len,232px);height:1.5px;margin-bottom:-.75px;transform-origin:0 50%;transform:rotate(calc(var(--a,45) * -1deg));transition:transform 1s var(--ease);background:linear-gradient(90deg,rgba(255,216,164,0),rgba(255,216,164,.85));filter:drop-shadow(0 0 6px rgba(255,200,130,.6))}
.sext ul{position:absolute;inset:0}
.sext li{position:absolute;left:calc(var(--pl) + var(--dx) - 22px);bottom:calc(var(--pb) + var(--dy) - 22px);pointer-events:auto;animation:fan .9s var(--ease) both;animation-delay:calc(var(--i) * 70ms + 200ms)}
@keyframes fan{from{opacity:.001;transform:translate(calc(var(--dx) * -.8),calc(var(--dy) * .8))}to{opacity:1;transform:none}}
.sext li button{display:flex;align-items:center;height:44px;background:none;border:0;color:var(--muted);cursor:pointer;font:600 14px var(--font-body);white-space:nowrap;padding:0}
.sext li button:hover{color:var(--ink)}
.sext .dw{width:44px;height:44px;display:grid;place-items:center;flex:none}
.sext .dw::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--night-deep);border:1.5px solid var(--ink-2);transition:all .4s var(--ease)}
.sext li button:hover .dw::after{transform:scale(1.35)}
.sext li button[aria-current="page"]{color:var(--ink)}
.sext li button[aria-current="page"] .dw::after{background:var(--ink);transform:scale(1.5);box-shadow:0 0 0 5px rgba(237,232,222,.14),0 0 22px rgba(255,208,150,.8)}
.sext .lab{padding-right:12px;text-shadow:0 1px 10px #000,0 0 3px #000;display:inline-flex;align-items:center;gap:8px}
.sext li button[aria-current="page"] .lab{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:19px}
.sext .n{font:500 11.5px var(--font-mono);background:var(--wait);color:#1b1405;border-radius:99px;padding:0 7px;line-height:19px}
.sext .kb{font:500 10.5px var(--font-mono);color:var(--faint);border:1px solid var(--line);border-radius:var(--r);padding:0 5px;line-height:16px;margin-right:2px;transition:color var(--d1),border-color var(--d1)}
.sext li button:hover .kb,.sext li button[aria-current="page"] .kb{color:var(--ink);border-color:var(--line-3)}
.sext li.pv button{color:var(--run)}

@media (max-width:899px){
  .sext{left:auto;right:0;width:100%;height:100%;pointer-events:none;--R:196px;--pr:max(22px,calc(env(safe-area-inset-right,0px) + 10px));--pb:max(24px,calc(env(safe-area-inset-bottom,0px) + 12px))}
  .sext::before{display:none}

  .sext .limb,.hub,.needle{display:none}
  .sext.open .limb.m,.sext.open .needle{display:block}
  .sext .limb{left:auto;right:var(--pr);transform:scaleX(-1)}
  .needle{left:auto;right:var(--pr);transform-origin:100% 50%;width:var(--lenm,200px);transform:rotate(calc(var(--am,45) * 1deg));background:linear-gradient(270deg,rgba(255,216,164,0),rgba(255,216,164,.85))}
  .sext .cur{display:flex}
  .piv{display:grid;place-items:center;position:absolute;right:calc(var(--pr) - 28px);bottom:calc(var(--pb) - 28px);width:56px;height:56px;border-radius:50%;pointer-events:auto;background:var(--ink);color:#14151C;border:0;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 6px rgba(237,232,222,.12);transition:transform .5s var(--ease)}

function limbSvg(g,n,cls){
  var top=g.y0+(n-1)*g.dy+30,p='',i,y,pts='',pts2='';
  for(y=0;y<=top;y+=6){pts+=(y?'L':'M')+px(y,g).toFixed(1)+' '+(-y)+' ';pts2+=(y?'L':'M')+(px(y,g)-30).toFixed(1)+' '+(-y)+' '}

  var step=g.dy/4;
  for(var k=-Math.floor((g.y0-4)/step);g.y0+k*step<=top-8;k++){
    var yy=g.y0+k*step,xx=px(yy,g),len=Math.sqrt(xx*xx+yy*yy),major=(k%4===0),l=major?15:7;
    p+='<path class="'+(major?'tk2':'tk')+'" d="M'+xx.toFixed(1)+' '+(-yy).toFixed(1)+'L'+(xx*(1-l/len)).toFixed(1)+' '+(-yy*(1-l/len)).toFixed(1)+'"/>';
  }

}

    var R=regionFor();SC.region(R.x,R.y,R.w,R.h);
    if(S.intro&&S.role){SC.intro()}
    SC.sync(m);
    var vn=sceneViewName();
    if(vn!==lastSceneView||S.intro){SC.view(vn,{dur:S.intro?2600:1350});lastSceneView=vn}
    document.getElementById('stage').setAttribute('data-scene',JSON.stringify(SC.state()));
  }

}

/* ---------- render ---------- */
var ui=document.getElementById('ui');
function focusHeading(){
  var hs=ui.querySelectorAll('[data-h1]');
  for(var i=0;i<hs.length;i++){if(hs[i].offsetParent!==null){hs[i].focus({preventScroll:true});return}}
}
function render(){
  var ae=document.activeElement,fk=ae&&ae.dataset&&ae.dataset.fk;
  var sin=document.getElementById('sheet-in'),st=sin?sin.scrollTop:0;
  var wasEnter=S.enter;
  ui.innerHTML=build();
  var sin2=document.getElementById('sheet-in');
  if(S.focusH1){S.focusH1=false;focusHeading();if(sin2)sin2.scrollTop=0}
  else{
    if(S.focusSel){var el=ui.querySelector(S.focusSel);S.focusSel=null;if(el)el.focus({preventScroll:false})}
    else if(fk){var e2=ui.querySelector('[data-fk="'+fk+'"]');if(e2)e2.focus({preventScroll:true})}
    if(sin2&&!wasEnter)sin2.scrollTop=st;
  }
  S.enter=false;
  syncNav();countUp();syncScene();
  if(S.focusPhase!=null){var pi=S.focusPhase;S.focusPhase=null;var prow=ui.querySelector('[data-hl="p:'+pi+'"]');if(prow){setTimeout(function(){try{prow.scrollIntoView({block:'center',behavior:RMQ?'auto':'smooth'})}catch(e){}prow.classList.add('pulse')},520)}}
  if(S.focusOrder){var id=S.focusOrder;S.focusOrder=null;var card=ui.querySelector('[data-ord="'+id+'"]');if(card){setTimeout(function(){try{card.scrollIntoView({block:'center',behavior:RMQ?'auto':'smooth'})}catch(e){}card.classList.add('pulse')},420)}}
}
function go(v){S.justDone=null;S.view=v;S.toolsOpen=false;S.sextOpen=false;S.confirming=null;S.tall=false;S.focusH1=true;S.enter=true;render()}
var tt;
function toast(msg,act){
  var el=document.getElementById('toast');
  el.innerHTML='<div class="toast"><span>'+esc(msg)+'</span>'+(act?'<button class="btn sm" data-act="preview" data-view="'+act.view+'">'+esc(act.label)+'</button>':'')+'<button class="x" data-act="toast-close" aria-label="Chiudi avviso">×</button></div>';
  clearTimeout(tt);tt=setTimeout(function(){el.innerHTML=''},9000);
}

/* ---------- actions ---------- */
function completeAction(id){
  var a=byId(S.data.actions,id);if(!a||a.status!=='Da completare')return;
  a.status='Completata';a.done=todayISO();
  var d=a.docId&&byId(S.data.docs,a.docId);
  if(d&&d.status==='Da approvare'){d.status='Approvato'}
  var o=a.orderId&&byId(S.data.orders,a.orderId);
  if(o&&o.status==='Da confermare'){o.status='Ordinato';o.note='';S.recent.add('o:'+o.id)}
  log('Cliente demo','Risposta dimostrativa a «'+a.title+'»'+(o?'. Ordine «'+o.name+'»: Da confermare → Ordinato':''));
  S.confirming=null;S.justDone=id;save();render();
  if(o&&SC)SC.focusItem(o.id);
  toast('Risposta registrata. È una conferma dimostrativa, senza valore legale.');
}
function setLight(name){
  S.light=name;
  if(SC){var L=SC.light(name);if(L){var a=L.az*Math.PI/180,e=L.el*Math.PI/180,root=document.documentElement.style;
    root.setProperty('--sx',Math.round(-Math.cos(a)*(30-e*20))+'px');root.setProperty('--sy',Math.round(10+(1-Math.sin(e))*34)+'px');
    var rgb={alba:'222,140,70',giorno:'214,170,110',tramonto:'230,100,60',notte:'80,100,210'}[name];root.setProperty('--pool-rgb',rgb);
    root.setProperty('--pool-x',{alba:'12%',giorno:'30%',tramonto:'88%',notte:'70%'}[name]);root.setProperty('--pool-y',{alba:'72%',giorno:'30%',tramonto:'70%',notte:'24%'}[name]);
    root.setProperty('--beam',{alba:'78deg',giorno:'104deg',tramonto:'128deg',notte:'96deg'}[name]);
  }}
}
var H={
'login-client':function(){S.role='client';S.preview=false;S.recent.clear();S.confirming=null;S.intro=true;go('overview')},
'login-admin':function(){S.role='admin';S.preview=false;S.recent.clear();S.confirming=null;S.intro=true;go('a-overview')},
'change-role':function(){S.role=null;S.preview=false;S.toolsOpen=false;S.sextOpen=false;S.view='login';S.focusH1=true;S.enter=true;render()},
'nav':function(t){S.forceGone=null;go(t.dataset.view)},
'go-about':function(){S.aboutFrom=S.role?{view:S.view,preview:S.preview}:null;S.toolsOpen=false;S.view='about';S.focusH1=true;S.enter=true;render()},
'back-from-about':function(){if(!S.role){S.view='login';S.focusH1=true;S.enter=true;render();return}var f=S.aboutFrom;if(f){S.preview=f.preview;go(f.view==='about'?(clientUI()?'overview':'a-overview'):f.view)}else go(S.role==='admin'&&!S.preview?'a-overview':'overview')},
'tools-toggle':function(){S.toolsOpen=!S.toolsOpen;render()},
'sext-toggle':function(){S.sextOpen=!S.sextOpen;syncNav()},
'sheet-tall':function(){S.tall=!S.tall;var s=ui.querySelector('.sheet');if(s)s.classList.toggle('tall',S.tall);var g=ui.querySelector('.grab');if(g)g.setAttribute('aria-expanded',S.tall?'true':'false')},
'light':function(t){setLight(t.dataset.l);ui.querySelectorAll('[data-act="light"]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===S.light?'true':'false')})},
'rot':function(t){if(SC)SC.rotate(parseInt(t.dataset.dir,10))},
'focus-item':function(t){if(SC)SC.focusItem(t.dataset.id)},
'sim-denied':function(){S.role='client';S.preview=false;go('denied')},
'sim-expired':function(){S.returnTo={role:S.role,view:S.view,preview:S.preview};S.toolsOpen=false;S.view='expired';S.focusH1=true;S.enter=true;render()},
'resume':function(){var r=S.returnTo||{role:'client',view:'overview',preview:false};S.role=r.role;S.preview=r.preview;go(r.view==='expired'?'overview':r.view)},
'sim-doc':function(){S.empty=false;if(S.role==='admin'&&!S.preview){S.prevAdminView=S.view;S.preview=true}var g=byId(S.data.docs,'d7')||S.data.docs[0];S.forceGone=g?g.id:null;S.docId=g?g.id:null;go('doc')},
'toggle-empty':function(){S.empty=!S.empty;S.toolsOpen=false;if(S.role==='admin'&&!S.preview){S.prevAdminView=S.view;S.preview=true}if(S.view==='doc'||!clientUI())S.view='overview';S.focusH1=true;S.enter=true;render();toast(S.empty?'Progetto vuoto attivo nella vista cliente.':'Progetto vuoto disattivato.')},
'reset':function(){S.data=seed();S.recent.clear();S.confirming=null;S.empty=false;S.toolsOpen=false;save();render();toast('Dati demo ripristinati.')},
'open-doc':function(t){S.docId=t.dataset.id;S.forceGone=null;S.confirming=null;go('doc')},
'ask-confirm':function(t){S.confirming=t.dataset.id;S.focusSel='[data-act="do-confirm"]';render()},
'cancel-confirm':function(){S.confirming=null;render()},
'do-confirm':function(t){completeAction(t.dataset.id)},
'preview':function(t){if(S.role!=='admin')return go(t.dataset.view||'overview');if(!S.preview)S.prevAdminView=S.view;S.preview=true;go(t.dataset.view||'overview')},
'exit-preview':function(){S.preview=false;go(S.prevAdminView||'a-overview')},
'skip':function(){focusHeading()},
'toast-close':function(){document.getElementById('toast').innerHTML=''}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){
    var ch=false;
    if(S.toolsOpen&&!e.target.closest('.tr')){S.toolsOpen=false;ch=true}
    if(S.sextOpen&&!e.target.closest('#sext')){S.sextOpen=false;syncNav()}
    if(ch)render();return;
  }
  if(t.disabled)return;
  var f=H[t.dataset.act];if(f)f(t);
});
document.addEventListener('keydown',function(e){
  var tg=e.target,tn=tg&&tg.tagName;
  if(e.key!=='Escape'&&(e.ctrlKey||e.metaKey||e.altKey||tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'))return;
  if(S.role&&S.view!=='expired'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    var kk=e.key;
    if(/^[1-9]$/.test(kk)){var set=navSet(),it=set[parseInt(kk,10)-1];if(it){e.preventDefault();S.forceGone=null;if(it[0]==='preview')H.preview({dataset:{view:'overview'}});else go(it[0]);return}}
    if(kk==='['||kk===']'){if(SC){SC.rotate(kk===']'?1:-1);e.preventDefault()}return}
    if(kk==='l'||kk==='L'){var ks=LP.map(function(l){return l[0]}),ni=(ks.indexOf(S.light)+1)%ks.length;setLight(ks[ni]);ui.querySelectorAll('[data-act="light"]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===S.light?'true':'false')});e.preventDefault();return}
  }
  if(e.key==='Escape'&&!S.toolsOpen&&!S.sextOpen&&!(tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT')){
    if(S.view==='doc'){go('docs');return}
    if(S.view==='about'){H['back-from-about']();return}
    if(S.preview&&S.role==='admin'){H['exit-preview']();return}
  }
  if(e.key==='Escape'){
    if(S.toolsOpen){S.toolsOpen=false;render();var b=ui.querySelector('[data-fk="tools-btn"]');if(b)b.focus()}
    else if(S.sextOpen){S.sextOpen=false;syncNav();var p=navEl.querySelector('.piv');if(p)p.focus()}
  }
});

/* hover link between the interface and the model */
var hlOn=null;
function hlSet(k){if(k===hlOn)return;hlOn=k;if(SC)SC.highlight(k)}
document.addEventListener('pointerover',function(e){var t=e.target.closest&&e.target.closest('[data-hl]');if(t)hlSet(t.dataset.hl)});
document.addEventListener('pointerout',function(e){var t=e.target.closest&&e.target.closest('[data-hl]');if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget)))hlSet(null)});
document.addEventListener('focusin',function(e){var t=e.target.closest&&e.target.closest('[data-hl]');if(t)hlSet(t.dataset.hl)});
document.addEventListener('focusout',function(e){var t=e.target.closest&&e.target.closest('[data-hl]');if(t)hlSet(null)});
function changed(label,view,flash){
  save();render();
  if(SC&&flash)SC.flash(flash);
  toast(label+' Il cliente lo vede subito.',{label:'Vedi come lo vede il cliente',view:view});
}
document.addEventListener('change',function(e){
  var t=e.target,k=t.dataset&&t.dataset.chg;if(!k)return;
  if(k==='docform-status'){var w=document.getElementById('due-wrap');if(w){w.hidden=t.value!=='Da approvare';var di=document.getElementById('d-due');if(di&&!w.hidden&&!di.value){var d=new Date();d.setDate(d.getDate()+7);di.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}}return}
  var id=t.dataset.id;
  if(k==='phase-status'){var p=byId(S.data.phases,id);if(!p||p.status===t.value)return;var old=p.status;p.status=t.value;p.done=t.value==='Completata'?todayISO():null;log('Studio','Fase «'+p.name+'»: '+old+' → '+p.status);S.recent.add('p:'+p.id);changed('Fase aggiornata.','timeline')}
  else if(k==='phase-date'){var p2=byId(S.data.phases,id);if(!p2||!t.value||p2.planned===t.value)return;p2.planned=t.value;log('Studio','Data indicativa della fase «'+p2.name+'»: '+fmt(t.value));S.recent.add('p:'+p2.id);changed('Data aggiornata.','timeline')}
  else if(k==='order-status'){var o=byId(S.data.orders,id);if(!o||o.status===t.value)return;var ol=o.status;o.status=t.value;if(t.value==='Consegnato')o.date=todayISO();log('Studio','Ordine «'+o.name+'»: '+ol+' → '+o.status);S.recent.add('o:'+o.id);changed('Ordine aggiornato.','orders');if(SC)SC.focusItem(o.id)}
  else if(k==='order-date'){var o2=byId(S.data.orders,id);if(!o2||!t.value||o2.date===t.value)return;o2.date=t.value;log('Studio','Data dell’ordine «'+o2.name+'»: '+fmt(t.value));S.recent.add('o:'+o2.id);changed('Data aggiornata.','orders')}
  else if(k==='doc-status'){var x=byId(S.data.docs,id);if(!x||x.status===t.value)return;var os=x.status;x.status=t.value;log('Studio','Documento «'+x.name+'»: '+os+' → '+x.status);S.recent.add('d:'+x.id);changed('Documento aggiornato.','docs')}
});
function setErr(id,msg){var f=document.getElementById(id),er=document.getElementById('e-'+id);if(!f||!er)return;if(msg){er.textContent=msg;er.hidden=false;f.setAttribute('aria-invalid','true')}else{er.hidden=true;er.textContent='';f.removeAttribute('aria-invalid')}}
document.addEventListener('input',function(e){var t=e.target;if(t.getAttribute&&t.getAttribute('aria-invalid')==='true')setErr(t.id,'')});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var kind=f.dataset.form,first=null,$$=function(i){return document.getElementById(i)};
  if(kind==='update'){
    var title=$$('u-title').value.trim(),msg=$$('u-msg').value.trim(),date=$$('u-date').value;
    setErr('u-title',title?'':'Scrivi un titolo.');setErr('u-msg',msg?'':'Scrivi il messaggio da mostrare al cliente.');setErr('u-date',date?'':'Scegli una data.');
    first=!title?'u-title':!msg?'u-msg':!date?'u-date':null;
    if(first){$$(first).focus();return}
    var u={id:nid('u'),title:title,msg:msg,date:date,author:$$('u-author').value,phase:$$('u-phase').value||null,doc:$$('u-doc').value||null};
    S.data.updates.push(u);S.recent.add('u:'+u.id);log('Studio','Pubblicato l’aggiornamento «'+title+'»');
    save();render();toast('Aggiornamento pubblicato.',{label:'Vedi come lo vede il cliente',view:'updates'});
  }else if(kind==='doc'){
    var name=$$('d-name').value.trim(),st=$$('d-status').value,due=$$('d-due').value;
    setErr('d-name',name?'':'Scrivi il nome del documento.');setErr('d-due',(st==='Da approvare'&&!due)?'Indica entro quando il cliente deve rispondere.':'');
    first=!name?'d-name':(st==='Da approvare'&&!due)?'d-due':null;
    if(first){$$(first).focus();return}
    var desc=$$('d-desc').value.trim()||'Documento dimostrativo.',fi=$$('d-file'),fn=fi&&fi.files&&fi.files[0]?fi.files[0].name:'';
    var doc={id:nid('d'),name:name,type:$$('d-type').value,date:todayISO(),version:1,status:st,desc:desc,lines:['Scheda documento registrata per la demo.'+(fn?' File indicato: '+fn+' (non caricato).':''),'Il contenuto reale non è presente: in una versione operativa qui ci sarebbe il file protetto.']};
    S.data.docs.push(doc);S.recent.add('d:'+doc.id);
    if(st==='Da approvare'){S.data.actions.push({id:nid('a'),title:'Approva «'+name+'»',desc:'Esamina il documento e conferma. '+desc,status:'Da completare',due:due,docId:doc.id,orderId:null,phase:null,cta:'Approva il documento',done:null});log('Studio','Aggiunto «'+name+'» e richiesta l’approvazione del cliente')}
    else log('Studio','Aggiunto il documento «'+name+'»');
    save();render();toast('Documento aggiunto.',{label:'Vedi come lo vede il cliente',view:'docs'});
  }
});

/* ---------- boot ---------- */
var tip=document.getElementById('tip');
(function boot(){
  var canvas=document.getElementById('stage');
  try{SC=makeScene(canvas)}catch(err){SC=null;try{console.warn('3D non disponibile',err)}catch(x){}}
  GL=!!SC;
  if(!GL){document.body.classList.add('nogl');canvas.style.display='none';var n=document.createElement('p');n.className='glfail';n.textContent='Il modello 3D non è disponibile su questo dispositivo. Tutte le altre funzioni del portale restano attive.';document.body.appendChild(n)}
  else{
    SC.onHover=function(id,x,y){
      if(!id){tip.classList.remove('on');return}
      var d=D(),isP=id.charAt(1)===':',o=isP?null:byId(d.orders,id),ph=isP?d.phases[parseInt(id.slice(2),10)]:null;
      if(!o&&!ph){tip.classList.remove('on');return}
      tip.innerHTML=o?esc(o.name)+'<span>'+esc(o.status)+'</span>':'Fase '+(parseInt(id.slice(2),10)+1)+' · '+esc(ph.name)+'<span>'+esc(ph.status)+'</span>';tip.style.left=x+'px';tip.style.top=y+'px';tip.classList.add('on');
    };
    SC.onPick=function(id){
      tip.classList.remove('on');
      if(id.charAt(1)===':'){S.focusPhase=parseInt(id.slice(2),10);go(clientUI()?'timeline':'a-phases');return}
      S.focusOrder=id;go(clientUI()?'orders':'a-orders');
    };
    setLight(S.light);
  }
  window.addEventListener('resize',function(){if(SC){var R=regionFor();SC.region(R.x,R.y,R.w,R.h)}});
  render();
})();

})();
