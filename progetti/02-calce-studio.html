<script>
const $=s=>document.querySelector(s),M=$('#main'),MD=$('#md'),R=document.documentElement,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const P=[
{id:'corte',t:'Casa della Corte',k:'Ristrutturazione',m:96,l:'Un appartamento degli anni ’30 riletto attorno a un solo asse di luce.',e:'Stanze piccole e chiuse, un corridoio buio. Chi abita la casa vuole una zona giorno ampia senza perdere la quiete della notte.',i:'La zona giorno si apre sulla facciata a sud e la cucina si sposta sul corridoio, che diventa un passaggio luminoso.',x:'Calce naturale, rovere oliato, cotto recuperato.',p:[[2,2,50,34,'b'],[52,2,66,40,'a'],[2,36,30,42,'a'],[32,42,86,36,'b'],[52,2,22,14,'c']]},
{id:'mansarda',t:'Mansarda a doppia quota',k:'Riorganizzazione',m:58,l:'Cinquantotto metri quadrati che si vivono come ottanta.',e:'Altezze variabili, poca superficie utile e nessuno spazio per contenere.',i:'Un unico elemento in legno riunisce armadi, scala e letto e libera il centro della stanza.',x:'Compensato di betulla, intonaco chiaro, ferro brunito.',p:[[2,2,116,76,'a'],[2,2,40,76,'b'],[42,2,12,76,'c'],[54,2,64,30,'b']]},
{id:'cucina',t:'Cucina e soggiorno continui',k:'Arredo',m:42,l:'Una cucina che si vede, ma si può anche chiudere.',e:'Cucina isolata dal soggiorno e arredi di serie poco proporzionati.',i:'Un’isola in un solo blocco e una libreria passante uniscono i due ambienti; un’anta scorrevole nasconde la cucina.',x:'Pietra grigia, noce, tessuti in lino.',p:[[2,2,60,34,'b'],[62,2,56,34,'a'],[2,36,116,4,'b'],[30,48,50,16,'c'],[2,40,116,38,'a']]},
{id:'loft',t:'Loft per due studi',k:'Riorganizzazione',m:74,l:'Casa e lavoro nello stesso spazio, senza confonderli.',e:'Due persone lavorano da casa e servono postazioni separate per vista e rumore.',i:'Una quinta di pannelli mobili divide e riunisce le zone; la luce guida il percorso fino alla zona notte.',x:'Feltro acustico, vetro satinato, linoleum.',p:[[2,2,36,36,'b'],[82,2,36,36,'b'],[2,38,116,40,'a'],[56,2,6,48,'c']]}
];
const S=[
['Progetto d’interni','Distribuzione degli ambienti, concept di stile e tavole di progetto.','Chi acquista casa o vuole ripensare gli spazi che abita.','Colloquio, rilievo, concept, tavole.'],
['Consulenza per ristrutturazioni','Valutazione delle opzioni e delle priorità, confronto con i tecnici abilitati.','Chi deve ristrutturare e non sa da dove cominciare.','Valutazione, priorità, confronto.'],
['Materiali e finiture','Palette di materiali, campioni, abbinamenti e scheda finiture.','Chi ha già una pianta ma deve scegliere pavimenti e rivestimenti.','Moodboard, campioni, scheda finiture.'],
['Concept e arredo','Selezione e disegno di arredi, illuminazione e tessili.','Chi vuole una casa coerente fino ai dettagli.','Brief, selezione, tavola d’insieme.']

const FP=[HP,P[1].p,P[2].p,P[0].p,P[3].p],LB=['Ingresso','Studio','Servizi','Progetti','Contatti'],lb=i=>`<span class="lb">${LB[i]}</span>`;

const inn=pl=>bx(0,0,480,320,8,'s')+pl.map(([x,y,w,h,k])=>bx(x*4,y*4,w*4,h*4,{a:3,b:16,c:38}[k],k,9)).join('');
MD.innerHTML=FP.map((p,i)=>`<div class="fl" data-i="${i}" style="--i:${i}">${inn(p)}${lb(i)}</div>`).join('');
const F3=MD.querySelector('[data-i="3"]');let cp=FP[3],cur=-1;
MD.onclick=e=>{const f=e.target.closest('.fl');if(f)location.hash=TK[f.dataset.i]};
const cta=`<p style="margin-top:1.6em"><a class="b p" href="#contatti">Scrivi allo studio</a></p>`;
const V={
home:()=>['Interni residenziali','Calce Studio progetta interni residenziali: ristrutturazioni, riorganizzazione degli spazi, materiali e arredo (concept).',`<h1>Case misurate su chi le abita.</h1><p class="lead">Calce Studio progetta interni residenziali: ristrutturazioni, riorganizzazione degli spazi, materiali e arredo. Ogni progetto parte dalla pianta e dalle abitudini di chi vive la casa.</p><p><a class="b p" href="#progetti">Guarda i progetti</a><a class="b" href="#contatti">Parla del tuo spazio</a></p><p class="sm">Il modello è la mappa del sito: ogni piano è una sezione. Muovi il cursore e la luce lo segue. Cambia piano dalla colonna a destra, con un clic sul modello o con i tasti freccia su e giù.</p><p class="sm">Nessun cliente, recapito o lavoro è reale.</p>`],
studio:()=>['Lo studio','Principi e metodo di lavoro di Calce Studio, studio d’interni dimostrativo.',`<h1>Lo studio</h1><p class="lead">Calce Studio è un’impresa concept: mostra come un sito aziendale può raccontare identità, metodo e servizi. Nessuna persona o qualifica reale è rappresentata.</p><dl><dt>Si parte dall’uso</dt><dd>Prima di disegnare si osserva come la casa viene vissuta ogni giorno.</dd><dt>Pochi materiali, scelti bene</dt><dd>Una palette ridotta rende gli spazi coerenti e più semplici da mantenere.</dd><dt>Decisioni leggibili</dt><dd>Ogni scelta è spiegata in tavole e schede verificabili dal cliente.</dd></dl><h2>Metodo</h2><ol><li><b>Colloquio.</b> Obiettivi, abitudini, vincoli.</li><li><b>Rilievo.</b> Misure, luce, impianti, punti critici.</li><li><b>Concept.</b> Due direzioni con piante e materiali.</li><li><b>Definizione.</b> Tavole finali, finiture, arredi.</li></ol>${cta}`],
servizi:()=>['Servizi','Servizi di Calce Studio: progetto d’interni, consulenza per ristrutturazioni, materiali e arredo.',`<h1>Servizi</h1><p class="lead">Quattro servizi, richiedibili separatamente o insieme.</p>${S.map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p><p class="sm"><b>Per chi:</b> ${s[2]} <b>Fasi:</b> ${s[3]}</p>`).join('')}<h2>Cosa non è incluso</h2><p>Pratiche edilizie e direzione lavori non sono offerte da questo studio concept: in un caso reale spettano a professionisti abilitati.</p>${cta}`],
progetti:()=>['Progetti','Quattro progetti concept di Calce Studio: ristrutturazione, riorganizzazione e arredo.',`<h1>Progetti concept</h1><p class="lead">Concept illustrativi, non lavori eseguiti. Aprine uno: la pianta sul piano Progetti cambia con lui.</p>${P.map(p=>`<a class="row" href="#p-${p.id}"><span>${p.k}, ${p.m} m²</span><b>${p.t}</b><em>${p.l}</em></a>`).join('')}`],
contatti:()=>['Contatti','Invia una richiesta a Calce Studio. Il modulo è dimostrativo e non trasmette dati.',`<h1>Contatti</h1><p class="lead">Descrivi lo spazio e cosa vorresti cambiare. Bastano poche righe.</p><p class="sm"><b>Modulo dimostrativo:</b> nessun dato viene inviato o salvato. Non inserire dati personali reali. Le pagine legali non sono incluse: richiederebbero dati reali.</p><form id="f" novalidate>
<div class="fd"><label for="nome">Nome</label><input id="nome" name="nome" autocomplete="name" aria-describedby="e-nome"><p class="er" id="e-nome"></p></div>
<div class="fd"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="e-email"><p class="er" id="e-email"></p></div>
<div class="fd"><label for="tipo">Di cosa hai bisogno</label><select id="tipo" name="tipo" aria-describedby="e-tipo"><option value="">Scegli un servizio</option>${S.map(s=>`<option>${s[0]}</option>`).join('')}</select><p class="er" id="e-tipo"></p></div>

<button class="b p" id="sb">Invia la richiesta</button></form><div id="rs" role="status" tabindex="-1"></div>`]
};

const H={contatti(){const f=$('#f');f.onsubmit=e=>{e.preventDefault();const v=n=>f[n].value.trim(),er={};

const bad=ids.find(n=>er[n]);if(bad){f[bad].focus();return}
